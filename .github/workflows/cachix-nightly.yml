name: ⚡ Cachix Build & Push

on:
  # Déclenchement à chaque push sur la branche principale
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - 'assets/**'
      - 'README.md'

  # Déclenchement nightly à 03h00 heure de Paris (CEST = 01:00 UTC)
  schedule:
    - cron: '0 1 * * *'

  # Déclenchement manuel avec choix du composant
  workflow_dispatch:
    inputs:
      target:
        description: 'Composant à mettre en cache'
        required: true
        default: 'matrix'
        type: choice
        options:
          - 'matrix'
          - 'kde'
          - 'cosmic'
          - 'cinnamon'
          - 'gnome'
          - 'emulators'
          - 'creation'
          - 'browsers'
          - 'tools'
          - 'full'
      include_davinci:
        description: 'Inclure DaVinci Resolve (⚠️ Attention : saturation du quota Cachix 5 Go)'
        required: false
        default: false
        type: boolean

concurrency:
  group: cachix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.target != 'full')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "🖥️ Desktop KDE Plasma 6"
            flake_target: ".#nixosConfigurations.kde.config.system.build.toplevel"
            id: "kde"
          - name: "🖥️ Desktop COSMIC 1.5+"
            flake_target: ".#nixosConfigurations.cosmic.config.system.build.toplevel"
            id: "cosmic"
          - name: "🖥️ Desktop Cinnamon"
            flake_target: ".#nixosConfigurations.cinnamon.config.system.build.toplevel"
            id: "cinnamon"
          - name: "🖥️ Desktop GNOME"
            flake_target: ".#nixosConfigurations.gnome.config.system.build.toplevel"
            id: "gnome"
          - name: "🕹️ Pack Émulateurs"
            flake_target: ".#packages.x86_64-linux.cache-matrix.allEmulators"
            id: "emulators"
          - name: "🎨 Pack Création 3D & Vidéo"
            flake_target: ".#packages.x86_64-linux.cache-matrix.allCreation"
            id: "creation"
          - name: "🌐 Pack Navigateurs"
            flake_target: ".#packages.x86_64-linux.cache-matrix.allBrowsers"
            id: "browsers"
          - name: "🛠️ Pack Outils Système & Gaming"
            flake_target: ".#packages.x86_64-linux.cache-matrix.allSystemTools"
            id: "tools"
    name: ${{ matrix.target.name }}
    steps:
      - name: 🔍 Vérification d'exécution pour cette cible
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.target }}" = "matrix" ] || [ "${{ inputs.target }}" = "${{ matrix.target.id }}" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Ignoré pour ce run (cible différente demandée)."
          fi

      - name: 📥 Récupération du dépôt
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: 🧹 Libération de l'espace disque du runner
        if: steps.check.outputs.should_run == 'true'
        run: |
          echo "📊 Espace disque avant nettoyage :"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL \
            /imagegeneration/installers/*.tar.gz \
            2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          echo "📊 Espace disque après nettoyage :"
          df -h /

      - name: ❄️ Installation de Nix
        if: steps.check.outputs.should_run == 'true'
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            warn-dirty = false
            max-jobs = 2

      - name: 🪄 Cache Nix GitHub Actions
        if: steps.check.outputs.should_run == 'true'
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: ⚡ Connexion à Cachix
        if: steps.check.outputs.should_run == 'true'
        uses: cachix/cachix-action@v17
        with:
          name: chomiamos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: 🔨 Construction & Push Cachix (${{ matrix.target.name }})
        if: steps.check.outputs.should_run == 'true'
        run: |
          echo "🚀 Construction et envoi vers chomiamos.cachix.org : ${{ matrix.target.flake_target }}"
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "📦 Tentative $attempt/$max_attempts..."
            if nix build "${{ matrix.target.flake_target }}" \
              --accept-flake-config \
              --fallback \
              --print-build-logs; then
              echo "✅ Succès à la tentative $attempt"
              exit 0
            fi
            echo "⚠️ Échec à la tentative $attempt"
            attempt=$((attempt + 1))
            if [ $attempt -le $max_attempts ]; then
              echo "⏳ Attente de 30s avant la prochaine tentative..."
              sleep 30
            fi
          done
          echo "❌ Échec après $max_attempts tentatives"
          exit 1

  cache-full-system:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    name: "🚀 Configuration Système Complète (Full)"
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'full'
    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: 🧹 Libération de l'espace disque du runner
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL \
            2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: ❄️ Installation de Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            warn-dirty = false
            max-jobs = 2

      - name: 🪄 Cache Nix GitHub Actions
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: ⚡ Connexion à Cachix
        uses: cachix/cachix-action@v17
        with:
          name: chomiamos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: 🔨 Construction & Push Configuration Full
        run: |
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "📦 Tentative $attempt/$max_attempts..."
            if nix build .#nixosConfigurations.full.config.system.build.toplevel \
              --accept-flake-config \
              --fallback \
              --print-build-logs; then
              echo "✅ Succès à la tentative $attempt"
              exit 0
            fi
            echo "⚠️ Échec à la tentative $attempt"
            attempt=$((attempt + 1))
            if [ $attempt -le $max_attempts ]; then
              sleep 30
            fi
          done
          exit 1

  cache-davinci:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    name: "🎬 DaVinci Resolve (Optionnel)"
    if: github.event_name == 'workflow_dispatch' && inputs.include_davinci == true
    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: 🧹 Libération de l'espace disque du runner
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL \
            2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: ❄️ Installation de Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            warn-dirty = false
            max-jobs = 2

      - name: 🪄 Cache Nix GitHub Actions
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: ⚡ Connexion à Cachix
        uses: cachix/cachix-action@v17
        with:
          name: chomiamos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: 🔨 Construction & Push DaVinci Resolve Free
        run: |
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "📦 Tentative $attempt/$max_attempts..."
            if nix build .#packages.x86_64-linux.cache-matrix.davinci.free \
              --accept-flake-config \
              --fallback \
              --print-build-logs; then
              echo "✅ Succès à la tentative $attempt"
              exit 0
            fi
            attempt=$((attempt + 1))
            if [ $attempt -le $max_attempts ]; then
              sleep 30
            fi
          done
          exit 1
